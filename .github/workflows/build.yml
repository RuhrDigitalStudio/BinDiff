name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore BinDiff.slnx
      - run: dotnet build BinDiff.slnx -c Release --no-restore
      - run: dotnet test BinDiff.Tests/BinDiff.Tests.csproj -c Release --no-build
      - run: dotnet format BinDiff.slnx --verify-no-changes --no-restore
